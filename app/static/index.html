<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Detection API</title>
<style>
  /* Layout: controls on the left, the image with drawn boxes on the right; results table below. */
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --fg: #e8ecf1; --mu: #95a0b0;
    --ac: #4cc2ff; --ok: #6ee7a8; --warn: #ffb648;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
  header { padding: 20px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header nav { display: flex; gap: 16px; font-size: .92rem; }
  a { color: var(--ac); }
  main { padding: 24px clamp(16px, 4vw, 40px); display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 24px; max-width: 1300px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  label { display: block; font-size: .85rem; color: var(--mu); margin: 14px 0 6px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 14px; text-align: center; cursor: pointer; color: var(--mu); }
  .drop.over, .drop:focus-visible { border-color: var(--ac); color: var(--fg); outline: none; }
  input[type=range] { width: 100%; accent-color: var(--ac); }
  select, button { font: inherit; color: var(--fg); background: #0b0e13; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  button { background: var(--ac); color: #04121c; border: 0; font-weight: 700; margin-top: 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .stage { position: relative; min-height: 320px; display: grid; place-items: center; }
  canvas { max-width: 100%; height: auto; border-radius: 8px; }
  .empty { color: var(--mu); text-align: center; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
  .stat { background: #0b0e13; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--mu); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--mu); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .err { color: #ff8a8a; margin-top: 12px; }
  pre { background: #0b0e13; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 280px; font: 12px/1.45 var(--mono); }
  details summary { cursor: pointer; color: var(--mu); margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Object Detection API</h1>
  <nav><a href="/docs">API docs</a><a href="/readyz">Status</a><a href="/metrics">Metrics</a></nav>
</header>
<main>
  <section class="panel" aria-label="Upload">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an image">
      Drop an image here or click to choose<br><small>JPEG, PNG or WebP, up to 10 MB</small>
    </div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    <label for="conf">Minimum confidence: <b id="confv">0.35</b></label>
    <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.35">
    <label for="filter">Show</label>
    <select id="filter">
      <option value="">All 80 object types</option>
      <option value="vehicles">Vehicles only</option>
      <option value="person">People only</option>
    </select>
    <button id="go" disabled>Detect objects</button>
    <p class="err" id="err" role="alert" hidden></p>
  </section>

  <section class="panel" aria-live="polite">
    <div class="stats" id="stats" hidden></div>
    <div class="stage"><canvas id="canvas" hidden></canvas><p class="empty" id="empty">Results appear here.</p></div>
    <div id="table"></div>
    <details id="raw" hidden><summary>JSON response</summary><pre id="json"></pre></details>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fileInput = $("file"), drop = $("drop"), go = $("go"), canvas = $("canvas");
  let file = null, img = null;

  const pick = (f) => {
    if (!f) return;
    file = f; go.disabled = false; $("err").hidden = true;
    drop.textContent = f.name;
    img = new Image();
    img.onload = () => paint([]);
    img.src = URL.createObjectURL(f);
  };
  drop.onclick = () => fileInput.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } };
  fileInput.onchange = () => pick(fileInput.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
  $("conf").oninput = (e) => { $("confv").textContent = Number(e.target.value).toFixed(2); };

  const color = (id) => `hsl(${(id * 47) % 360} 85% 60%)`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function paint(dets) {
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const lw = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 300));
    const fs = Math.max(12, Math.round(Math.min(canvas.width, canvas.height) / 40));
    ctx.font = `600 ${fs}px system-ui, sans-serif`; ctx.lineWidth = lw;
    for (const d of dets) {
      const { x1, y1, x2, y2 } = d.box, c = color(d.class_id);
      ctx.strokeStyle = c; ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      const t = `${d.label} ${d.confidence.toFixed(2)}`, tw = ctx.measureText(t).width;
      const ty = Math.max(0, y1 - fs - 6);
      ctx.fillStyle = c; ctx.fillRect(x1, ty, tw + 10, fs + 6);
      ctx.fillStyle = "#000"; ctx.fillText(t, x1 + 5, ty + fs);
    }
    canvas.hidden = false; $("empty").hidden = true;
  }

  go.onclick = async () => {
    go.disabled = true; go.textContent = "Detecting…"; $("err").hidden = true;
    const body = new FormData(); body.append("file", file);
    const q = new URLSearchParams({ conf: $("conf").value });
    if ($("filter").value) q.set("labels", $("filter").value);
    const t0 = performance.now();
    try {
      const res = await fetch(`/v1/detect?${q}`, { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : res.statusText);
      const total = performance.now() - t0;
      paint(data.detections);
      $("stats").innerHTML = [
        [data.count, "objects"], [data.vehicle_count, "vehicles"],
        [`${data.inference_ms} ms`, "model time"], [`${Math.round(total)} ms`, "round trip"],
      ].map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
      $("stats").hidden = false;
      const rows = Object.entries(data.counts).map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join("");
      $("table").innerHTML = rows ? `<table><thead><tr><th>Label</th><th class="n">Count</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="empty">No objects above the confidence threshold.</p>`;
      $("json").textContent = JSON.stringify(data, null, 2); $("raw").hidden = false;
    } catch (e) {
      $("err").textContent = `Detection failed: ${e.message}`; $("err").hidden = false;
    } finally {
      go.disabled = false; go.textContent = "Detect objects";
    }
  };
})();
</script>
</body>
</html>
