# Adds pods when average CPU passes 60% of the request, up to 4; removes them after 1 quiet minute
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: detector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: detector
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
