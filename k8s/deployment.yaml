apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  labels:
    app.kubernetes.io/name: detector
spec:
  # The HorizontalPodAutoscaler owns the replica count after the first apply
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: detector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # never drop below the current capacity during a deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detector
          image: ghcr.io/lenohutapea/object-detection-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ORT_THREADS
              value: "1"
            - name: CONF_THRESHOLD
              value: "0.35"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup: give the model time to load before the other probes start
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Readiness: only send traffic once the model is loaded
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness: restart the container if the process stops answering
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # large uploads are spooled here
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
