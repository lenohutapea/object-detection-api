name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: pytest -q

  docker:
    name: Build image and test with the real model
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (downloads the YOLOX-nano model)
        run: docker build -t object-detection-api:ci .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 object-detection-api:ci

      - name: Get a test image
        run: curl -fsSL -o /tmp/dog.jpg https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/main/assets/dog.jpg

      - name: Smoke test, expects a dog in the photo
        run: python3 scripts/smoke_test.py http://localhost:8000 /tmp/dog.jpg dog

      - name: Image size
        run: docker image ls object-detection-api:ci

      - name: Container logs
        if: always()
        run: docker logs api

  publish:
    name: Publish image to GitHub Container Registry
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
